services:
  - type: web
    name: civic-connect
    runtime: docker
    plan: free
    # Render uses the Dockerfile directly; docker-compose.yml is for local runs.
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: COOKIE_SAME_SITE
        value: strict
